# The main conda environment for Nanometa Live.
# Installation instructions in readme on github.

name: nanometa_live_env
channels:
  - conda-forge
  - bioconda
channel_priority: strict
dependencies:
  - python >=3.11.0
  - dash >=4.0.0
  - dash-daq >=0.6.0
  - dash-bootstrap-components >=1.7.1
  # The remaining runtime requirements of requirements.txt. The dashboard
  # imports dash-ag-grid at load and runs its background callbacks on
  # diskcache + multiprocess + dill + psutil, so an environment built from
  # this file alone used to fail at import and `pip install .` then reached
  # PyPI -- on a field machine, with no network (field audit 2026-10-28,
  # H6). tests/test_env_yml_covers_requirements.py keeps the two in step.
  - dash-ag-grid >=31.0.0
  - diskcache >=5.6.0
  - psutil >=6.0.0
  - multiprocess >=0.70.0
  - dill >=0.3.0
  - openpyxl >=3.1.0
  - plotly >=6.0.0
  - numpy >=2.0.0
  - pandas >=2.2.3
  - pyyaml >=6.0.1
  - pytest >=7.2.1
  - tqdm >=4.67.1
  - setuptools >=67.6.0
  - pip >=23.0.1
  - blast >=2.16.0
  - biopython >=1.85
  - gzip >=1.10
  - kraken2 >=2.1.4
  - fastp >=0.23.2
  # The nanometanf pipeline is launched as a subprocess and floors at
  # Nextflow 26.04.0 (manifest in nanometanf/nextflow.config). Without it
  # this environment gives a working dashboard and a pipeline that fails
  # the moment Start Analysis is pressed.
  - nextflow >=26.04.0
  - ruamel.yaml >=0.18.10
  - ncbi-datasets-cli >=17.1.0
  - pyfastx >=2.2.0
  - flask >=3.1.0
  - scipy >=1.10.0
  - requests >=2.32.3