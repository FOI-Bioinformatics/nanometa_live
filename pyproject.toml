[build-system]
requires = ["setuptools>=67.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Nanometa_Live"
description = "Real-time metagenomic analysis with a user-friendly interface"
readme = "README.md"
# CI exercises 3.11 and 3.12 only, and numpy 2.x no longer supports 3.9/3.10,
# so anything below 3.11 is untested and unsatisfiable in practice.
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Nanometa Live Team" }]
# version comes from nanometa_live/__init__.py and dependencies from
# requirements.txt; see [tool.setuptools.dynamic] below. Keeping both
# dynamic means there is exactly one place to edit either of them.
dynamic = ["version", "dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/FOI-Bioinformatics/nanometa_live"

[project.optional-dependencies]
dev = [
    "pytest>=7.2.1",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "filelock>=3.10.0",
]

[project.scripts]
nanometa-live = "nanometa_live.nanometa_live:main"
nanometa-prepare = "nanometa_live.cli.prepare:main"
nanometa-report = "nanometa_live.cli.report:main"

[tool.setuptools.dynamic]
version = { attr = "nanometa_live.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["nanometa_live*"]

[tool.setuptools.package-data]
nanometa_live = [
    "config.yaml",
    "kraken2_databases.yaml",
    "app/assets/*",
    "core/config/data/*.yaml",
    "core/config/data/watchlists/*.yaml",
    "core/config/data/watchlists/examples/*.yaml",
]
