name: Cross-machine bundle deploy

# The offline bundle is how this software reaches an air-gapped field machine.
# Every existing test of it is a same-machine round-trip: export and import run
# in the same process, on the same filesystem, with the same absolute paths
# already valid. That gives a confidence it has not earned, because the failure
# mode the bundle actually has is precisely the one a same-machine test cannot
# produce -- paths recorded on the build machine that do not exist on the
# target.
#
# This job exports on one runner and imports on a second, freshly provisioned
# one, with the build runner's home directory gone. Anything that only worked
# because the exporting machine was still around fails here.
#
# KNOWN LIMITS, so a green run is not over-read:
#   - A GitHub runner is not air-gapped. Network calls that should have been
#     suppressed by offline_mode can still succeed here, so this does not
#     prove offline correctness -- only that the bundle transfers and imports.
#   - Both runners are the same OS and architecture. Conda environments embed
#     absolute paths and per-arch binaries, so arm64-vs-x86 portability is
#     still unproven, as is macOS-to-Linux.
#   - Pre-warmed conda environments are NOT exercised (--no-pre-warm below):
#     warming them needs a full nanometanf checkout and many minutes of solve
#     time. Conda relocation across machines therefore remains UNVERIFIED.

on:
  pull_request:
    paths:
      - 'nanometa_live/core/workflow/bundle_manager.py'
      - 'nanometa_live/core/workflow/container_inventory.py'
      - 'nanometa_live/core/workflow/nextflow_manager.py'
      - 'nanometa_live/cli/prepare.py'
      - '.github/workflows/bundle-deploy.yml'
  push:
    branches: [dev, main]
    paths:
      - 'nanometa_live/core/workflow/bundle_manager.py'
      - 'nanometa_live/core/workflow/container_inventory.py'
      - 'nanometa_live/core/workflow/nextflow_manager.py'
      - 'nanometa_live/cli/prepare.py'
      - '.github/workflows/bundle-deploy.yml'
  schedule:
    # Weekly, so a change in Nextflow's singularity cache-name convention
    # is noticed within a week rather than on a field machine.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export bundle (build machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build a minimal prepared installation
        run: |
          set -euo pipefail
          HOME_DIR="$RUNNER_TEMP/nanometa_home"
          mkdir -p "$HOME_DIR/genomes" "$HOME_DIR/watchlists"
          printf '>seq1\nACGTACGTACGTACGTACGT\n' > "$HOME_DIR/genomes/1392.fasta"
          cat > "$HOME_DIR/watchlists/operator.yaml" <<'YAML'
          metadata:
            name: Operator list
          pathogens:
            - name: Bacillus anthracis
              taxid_ncbi: 1392
              threat_level: critical
              alert_threshold: 5
          YAML

          # A stand-in pipeline checkout. The bundle ships whatever it is
          # pointed at; it does not need to be runnable for the transfer and
          # checksum verification under test here.
          PIPE="$RUNNER_TEMP/nanometanf"
          mkdir -p "$PIPE/conf"
          echo 'workflow { }' > "$PIPE/main.nf"
          echo "manifest { name = 'nanometanf' }" > "$PIPE/nextflow.config"
          echo 'process { cpus = 1 }' > "$PIPE/conf/base.config"

          mkdir -p "$RUNNER_TEMP/db"
          cat > "$RUNNER_TEMP/config.yaml" <<YAML
          nanometa_home: "$HOME_DIR"
          kraken_db: "$RUNNER_TEMP/db"
          pipeline_source: "$PIPE"
          offline_mode: true
          YAML

          echo "NANOMETA_HOME_DIR=$HOME_DIR" >> "$GITHUB_ENV"

      - name: Export
        env:
          NANOMETA_DATA_DIR: ${{ env.NANOMETA_HOME_DIR }}
        run: |
          nanometa-prepare export \
            --config "$RUNNER_TEMP/config.yaml" \
            --output "$RUNNER_TEMP/bundle.tar.gz" \
            --no-pre-warm
          ls -la "$RUNNER_TEMP/bundle.tar.gz"

      - name: Remove the build machine's home before handing the bundle on
        run: rm -rf "$NANOMETA_HOME_DIR" "$RUNNER_TEMP/nanometanf"

      - uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: ${{ runner.temp }}/bundle.tar.gz
          retention-days: 1

  import:
    name: Import bundle (field machine)
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: offline-bundle
          path: ${{ runner.temp }}

      - name: Verify before importing
        run: |
          # verify is the operator's dry run. It must agree with the import
          # that follows; a dry run that passes where the import fails is
          # worse than no dry run at all.
          nanometa-prepare verify --bundle "$RUNNER_TEMP/bundle.tar.gz"

      - name: Import onto a machine that never saw the exporter
        run: |
          set -euo pipefail
          FIELD_HOME="$RUNNER_TEMP/field_home"
          # The import target comes from NANOMETA_DATA_DIR; the subcommand has
          # no --nanometa-home flag. --db is required and is transferred
          # separately from the bundle by design (the Kraken2 database is
          # excluded for size), so a stand-in directory is enough here.
          mkdir -p "$RUNNER_TEMP/field_db"
          NANOMETA_DATA_DIR="$FIELD_HOME" nanometa-prepare import \
            --bundle "$RUNNER_TEMP/bundle.tar.gz" \
            --db "$RUNNER_TEMP/field_db"
          echo "FIELD_HOME=$FIELD_HOME" >> "$GITHUB_ENV"

      - name: Assert the imported installation is actually usable
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, sys

          home = pathlib.Path(os.environ["FIELD_HOME"])
          problems = []

          # The operator's watchlist and reference genomes must have survived.
          for rel in ("watchlists/operator.yaml", "genomes/1392.fasta"):
              if not (home / rel).is_file():
                  problems.append(f"missing after import: {rel}")

          # The pipeline is what the operator actually runs; if it did not
          # arrive, the field machine can display results but not produce them.
          if not list(home.rglob("main.nf")):
              problems.append("no main.nf under the imported home")

          # Any path recorded in the imported config must resolve ON THIS
          # machine. This is the check a same-machine round-trip cannot make,
          # because there the build machine's paths are still valid.
          import yaml
          for cfg in home.rglob("config.yaml"):
              data = yaml.safe_load(cfg.read_text()) or {}
              for key, value in data.items():
                  if not isinstance(value, str) or not value.startswith("/"):
                      continue
                  if value.startswith(("remote:", "http")):
                      continue
                  if not pathlib.Path(value).exists():
                      problems.append(
                          f"{cfg.name}: {key} points at {value}, which does "
                          f"not exist on this machine"
                      )

          if problems:
              print("Imported installation is not usable:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("Imported installation verified on a machine that never saw "
                "the exporter.")
          PY

      - name: Confirm doctor runs against the imported install
        run: |
          # Not asserted as passing: this runner has no Nextflow or Java, so
          # doctor SHOULD report failures. What is asserted is that it runs to
          # completion and reports them, rather than crashing -- a doctor that
          # traces back tells a field operator nothing.
          nanometa-prepare doctor || true

  export-singularity:
    # amd64 execution of a bundled image has never been observed: the one
    # air-gapped rig was arm64 and failed exactly at "image architecture
    # (amd64) could not run on the host (arm64)". This pair of jobs exports
    # a singularity bundle on an amd64 runner, imports it on a second one,
    # and RUNS the bundled image offline. LIMITS: one stand-in module with
    # one real image (not the ~25 of nanometanf), and the runner is not
    # air-gapped -- the assertion that no pull happened rests on the
    # Nextflow log, not on a closed network.
    name: Export singularity bundle (amd64 build machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Apptainer
        # Third-party actions are not allowed by this repository's Actions
        # policy; this installs the same release .deb the setup-apptainer
        # action would.
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/apptainer.deb" \
            https://github.com/apptainer/apptainer/releases/download/v1.3.6/apptainer_1.3.6_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$RUNNER_TEMP/apptainer.deb"
          apptainer --version

      - name: Build a one-module stand-in pipeline
        run: |
          set -euo pipefail
          HOME_DIR="$RUNNER_TEMP/nanometa_home"
          mkdir -p "$HOME_DIR/watchlists"
          PIPE="$RUNNER_TEMP/standin"
          mkdir -p "$PIPE/modules/local/seqtk_arch"

          # The container directive uses the nf-core ternary so the inventory
          # walker finds both the singularity URL and the docker reference,
          # and the singularity profile resolves the same URL the bundle
          # pre-pulled. No Unicode in these files.
          cat > "$PIPE/modules/local/seqtk_arch/main.nf" <<'NF'
          process SEQTK_ARCH {
              container "${ workflow.containerEngine == 'singularity' ? 'https://depot.galaxyproject.org/singularity/seqtk:1.4--he4a0461_2' : 'quay.io/biocontainers/seqtk:1.4--he4a0461_2' }"

              output:
              path 'arch.txt'

              script:
              """
              uname -m > arch.txt
              seqtk 2>&1 | head -n 1 >> arch.txt || true
              """
          }
          NF

          cat > "$PIPE/main.nf" <<'NF'
          include { SEQTK_ARCH } from './modules/local/seqtk_arch/main'

          workflow {
              SEQTK_ARCH()
              SEQTK_ARCH.out.view { f -> "arch: " + f.text.trim() }
          }
          NF

          cat > "$PIPE/nextflow.config" <<'NF'
          manifest {
              name    = 'nanometanf'
              version = '1.10.0'
          }

          profiles {
              singularity {
                  singularity.enabled    = true
                  singularity.autoMounts = true
              }
          }
          NF

          mkdir -p "$RUNNER_TEMP/db"
          cat > "$RUNNER_TEMP/config.yaml" <<YAML
          nanometa_home: "$HOME_DIR"
          kraken_db: "$RUNNER_TEMP/db"
          pipeline_source: "$PIPE"
          pipeline_profile: "singularity"
          offline_mode: true
          YAML
          echo "NANOMETA_HOME_DIR=$HOME_DIR" >> "$GITHUB_ENV"
          echo "STANDIN_PIPE=$PIPE" >> "$GITHUB_ENV"

      - name: Export a singularity bundle for linux/amd64
        env:
          NANOMETA_DATA_DIR: ${{ env.NANOMETA_HOME_DIR }}
        run: |
          nanometa-prepare export \
            --config "$RUNNER_TEMP/config.yaml" \
            --output "$RUNNER_TEMP/bundle-sing.tar.gz" \
            --no-pre-warm \
            --containerization singularity \
            --target-platform linux/amd64 \
            --pipeline "$STANDIN_PIPE"
          ls -la "$RUNNER_TEMP/bundle-sing.tar.gz"

      - name: The bundle carries exactly one image under the predicted name
        run: |
          python - <<'PY'
          import os, sys, tarfile
          path = os.path.join(os.environ["RUNNER_TEMP"], "bundle-sing.tar.gz")
          expected = "depot.galaxyproject.org-singularity-seqtk-1.4--he4a0461_2.img"
          with tarfile.open(path) as tar:
              names = tar.getnames()
          images = [n for n in names if "/pipeline_containers/" in n and n.endswith((".img", ".sif"))]
          print("images in bundle:", images)
          if len(images) != 1 or not images[0].endswith("/" + expected):
              print(f"expected one image named {expected}")
              sys.exit(1)
          PY

      - name: Remove the build machine's home and checkout before handing on
        run: rm -rf "$NANOMETA_HOME_DIR" "$STANDIN_PIPE"

      - uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-singularity
          path: ${{ runner.temp }}/bundle-sing.tar.gz
          retention-days: 1

  run-singularity:
    name: Import and run the bundled image (amd64 field machine)
    needs: export-singularity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Apptainer
        # Third-party actions are not allowed by this repository's Actions
        # policy; this installs the same release .deb the setup-apptainer
        # action would.
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/apptainer.deb" \
            https://github.com/apptainer/apptainer/releases/download/v1.3.6/apptainer_1.3.6_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$RUNNER_TEMP/apptainer.deb"
          apptainer --version

      - name: Install Nextflow
        run: |
          curl -fsSL get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow
          nextflow -v

      - uses: actions/download-artifact@v4
        with:
          name: offline-bundle-singularity
          path: ${{ runner.temp }}

      - name: Verify, then import onto a machine that never saw the exporter
        run: |
          set -euo pipefail
          nanometa-prepare verify --bundle "$RUNNER_TEMP/bundle-sing.tar.gz"
          FIELD_HOME="$RUNNER_TEMP/field_home"
          mkdir -p "$RUNNER_TEMP/field_db"
          NANOMETA_DATA_DIR="$FIELD_HOME" nanometa-prepare import \
            --bundle "$RUNNER_TEMP/bundle-sing.tar.gz" \
            --db "$RUNNER_TEMP/field_db"
          echo "FIELD_HOME=$FIELD_HOME" >> "$GITHUB_ENV"

      - name: Read the wiring the import wrote
        run: |
          python - <<'PY'
          import os, pathlib, sys, yaml
          home = pathlib.Path(os.environ["FIELD_HOME"])
          cfg = yaml.safe_load((home / "config.yaml").read_text()) or {}
          cache = cfg.get("nxf_singularity_cachedir") or ""
          pipe = cfg.get("pipeline_source") or ""
          problems = []
          if not cache or not pathlib.Path(cache).is_dir():
              problems.append(f"nxf_singularity_cachedir not wired: {cache!r}")
          if not pipe or not (pathlib.Path(pipe) / "main.nf").is_file():
              problems.append(f"pipeline_source not rebased to a checkout: {pipe!r}")
          if cfg.get("offline_mode") is not True:
              problems.append("offline_mode is not True after import")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"SING_CACHE={cache}\nFIELD_PIPE={pipe}\n")
          print("cache:", cache); print("pipeline:", pipe)
          PY

      - name: Run the bundled image offline on amd64
        env:
          NXF_OFFLINE: "true"
          NXF_DISABLE_CHECK_LATEST: "true"
          NXF_SINGULARITY_CACHEDIR: ${{ env.SING_CACHE }}
          NXF_SINGULARITY_LIBRARYDIR: ${{ env.SING_CACHE }}
        run: |
          set -euo pipefail
          uname -m
          cd "$RUNNER_TEMP"
          nextflow run "$FIELD_PIPE/main.nf" \
            -profile singularity \
            -ansi-log false \
            -work-dir "$RUNNER_TEMP/work" | tee run.out

      - name: The image was found locally, not pulled, and ran as x86_64
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          LOG=.nextflow.log
          grep -q "found local library for image" "$LOG" || { echo "no local-library hit in $LOG"; grep -i singularity "$LOG" || true; exit 1; }
          if grep -qi "pulling singularity image" "$LOG"; then echo "Nextflow pulled an image; the bundle was not used"; exit 1; fi
          grep -q "arch: x86_64" run.out || { echo "process output did not report x86_64"; cat run.out; exit 1; }
          echo "OK: bundled image executed on amd64 without a pull."
